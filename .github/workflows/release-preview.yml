name: Release Preview

# PR に含まれる changeset から「リリース予定バージョン」を算出し、PR に
# sticky コメントで表示する（push のたびに同じコメントを更新）。
# 算出は changeset status（非破壊）で行い、実バージョンは確定しない。
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main, release]

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # PR へのコメント投稿/更新に必要

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset status --since がベース分岐点を辿るため全履歴が必要

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ベースブランチとの差分から、未消化 changeset の版計算を JSON 出力（非破壊）。
      # 変更はあるが changeset が無い等で status が非0終了しても後段で扱えるよう握りつぶす。
      - name: Compute planned versions
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          pnpm changeset status --since="origin/${{ github.base_ref }}" --output=release-preview.json || true

      - name: Comment planned versions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- release-preview -->';

            let releases = [];
            try {
              const data = JSON.parse(fs.readFileSync('release-preview.json', 'utf8'));
              releases = data.releases || [];
            } catch {
              // 出力なし = 対象なしとして扱う
            }

            let body;
            if (releases.length === 0) {
              body = [
                marker,
                '### 📦 リリース予定バージョン',
                '',
                'この PR に有効な changeset はありません。リリース対象なし',
                '（`pnpm changeset` で追加できます）。',
              ].join('\n');
            } else {
              const rows = releases
                .map((r) => `| \`${r.name}\` | ${r.oldVersion} | **${r.newVersion}** | ${r.type} |`)
                .join('\n');
              body = [
                marker,
                '### 📦 リリース予定バージョン',
                '',
                'この PR の changeset を昇格すると、stable では次の版が公開されます。',
                '',
                '| package | current | planned | bump |',
                '|---|---|---|---|',
                rows,
                '',
                '- チャネル別: develop=`X.Y.Z-snapshot-<sha>` / main=`X.Y.Z-rc-<sha>` / release=`X.Y.Z`（latest）',
              ].join('\n');
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
