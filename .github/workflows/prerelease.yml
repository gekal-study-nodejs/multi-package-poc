name: Pre-release Mode

# Changesets の pre モード（rc）を GUI から切り替えるワークフロー。
# enter で .changeset/pre.json を作成、exit で削除し、main に直接コミットする。
#
# pre モードに入っている間は、通常の release.yml が Version PR を X.Y.Z-rc.N として
# 生成し、changeset publish は自動で dist-tag `rc` へ公開する（@changesets/cli の
# preState.tag 判定）。rc を打ち切って stable に戻すときは exit を実行する。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "pre モードの操作"
        type: choice
        options:
          - enter
          - exit
        required: true
      tag:
        description: "pre-release タグ（enter のときのみ使用）"
        default: rc
        required: false

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # .changeset/pre.json を main へコミットするために必要

jobs:
  pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enter / exit pre mode
        run: |
          if [ "${{ inputs.action }}" = "enter" ]; then
            pnpm changeset pre enter "${{ inputs.tag }}"
          else
            pnpm changeset pre exit
          fi

      - name: Commit pre.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .changeset/pre.json
          if git diff --cached --quiet; then
            echo "変更なし（既に目的の状態です）。"
            exit 0
          fi
          git commit -m "chore: changeset pre ${{ inputs.action }} (${{ inputs.tag }})"
          git push
