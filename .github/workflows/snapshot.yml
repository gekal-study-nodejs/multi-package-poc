name: Snapshot (develop)

# 始点ブランチ develop への push で、検証用の snapshot 版を公開する。
# バージョンは <計算済み次期版>-snapshot-<commit>（例: 0.2.1-snapshot-<sha>）。
# dist-tag は `snapshot`。git tag もバージョン履歴も残さない使い捨て。
# 昇格チェーン: develop(snapshot) → main(rc) → release(stable)。
on:
  push:
    branches: [develop]
  workflow_dispatch:

# 同一ブランチの古い発行はキャンセル
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # GitHub Packages への publish に必要

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # GitHub Packages を既定レジストリにし、認証用 .npmrc を生成する
          registry-url: https://npm.pkg.github.com
          scope: "@gekal-study-nodejs"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 未消化の changeset が無ければ bump 対象ゼロ = 公開なし。事前に判定する。
      - name: Detect changesets
        id: cs
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "未消化の changeset がありません。snapshot は公開しません。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # <次期版>-snapshot-<commit> へバージョン（ワークスペース内のみ / commit しない）
      - name: Version (snapshot)
        if: steps.cs.outputs.have == 'true'
        run: pnpm version:snapshot

      # build + changeset publish --tag snapshot --no-git-tag
      - name: Build & publish snapshot
        if: steps.cs.outputs.have == 'true'
        run: pnpm release:snapshot
        env:
          # GitHub Packages への publish 認証。追加の secret は不要。
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 公開した版を Job Summary に残す
      - name: Summary
        if: steps.cs.outputs.have == 'true'
        run: |
          {
            echo "### 📦 Snapshot 公開"
            echo ""
            echo "dist-tag \`snapshot\` で公開しました。install 例:"
            echo ""
            echo '```bash'
            for p in core utils client; do
              v=$(node -p "require('./packages/$p/package.json').version")
              echo "pnpm add @gekal-study-nodejs/$p@$v"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
