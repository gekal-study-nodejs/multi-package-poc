name: Release (stable)

# main から昇格した release ブランチへの push で stable 版を公開する。
# ここで初めて changeset を消費し、実バージョン X.Y.Z を確定させる。
# 昇格チェーン: develop(snapshot) → main(rc) → release(stable / latest)。
on:
  push:
    branches: [release]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # "Version Packages" PR の作成/更新に必要
  pull-requests: write
  packages: write # GitHub Packages への publish に必要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # GitHub Packages を既定レジストリにし、認証用 .npmrc を生成する
          registry-url: https://npm.pkg.github.com
          scope: "@gekal-study-nodejs"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 未消化の changeset があれば "Version Packages" PR を release ブランチ向けに作成/更新。
      # なければ pnpm release（build + changeset publish）で stable(latest) を公開。
      # 公開後は package.json の版 bump / CHANGELOG を develop へ back-merge すること
      # （詳細は docs/RELEASING.md / docs/PRERELEASE.md）。
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Packages への publish 認証。追加の secret は不要。
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
