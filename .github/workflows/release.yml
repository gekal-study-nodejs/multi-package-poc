name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # "Version Packages" PR の作成/更新に必要
  pull-requests: write
  packages: write # GitHub Packages への publish に必要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # GitHub Packages を既定レジストリにし、認証用 .npmrc を生成する
          registry-url: https://npm.pkg.github.com
          scope: "@gekal-study-nodejs"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 未消化の changeset があれば "Version Packages" PR を作成/更新。
      # なければ pnpm release（build + changeset publish）で GitHub Packages へ公開。
      # pre モード（.changeset/pre.json あり）のときは Version PR が X.Y.Z-rc.N になり、
      # publish は自動で dist-tag `rc` へ向く（詳細は docs/PRERELEASE.md）。
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Packages への publish 認証。追加の secret は不要。
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
